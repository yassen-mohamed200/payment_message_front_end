<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم الدفع بنجاح</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(34,197,94,0.15) 0%, transparent 70%);
    top: -200px;
    left: -100px;
  }

  .card {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    position: relative;
    z-index: 1;
    animation: fadeUp 0.6s ease-out;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .icon-wrap {
    width: 88px;
    height: 88px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 8px rgba(34,197,94,0.1), 0 8px 24px rgba(34,197,94,0.35);
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
  }

  @keyframes pop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }

  .icon-wrap svg {
    width: 42px;
    height: 42px;
    stroke: white;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .checkmark {
    stroke-dasharray: 48;
    stroke-dashoffset: 48;
    animation: draw 0.5s ease forwards 0.5s;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  h1 {
    color: #f8fafc;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  p {
    color: #94a3b8;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 32px;
  }

  .order-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
  }

  .order-box span:first-child { color: #64748b; }
  .order-box span:last-child { color: #e2e8f0; font-weight: 600; direction: ltr; }

  .btn {
    display: inline-block;
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 15px;
    transition: all 0.25s ease;
    box-shadow: 0 8px 20px rgba(34,197,94,0.25);
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(34,197,94,0.4);
  }

  .footer-note {
    margin-top: 20px;
    font-size: 12.5px;
    color: #475569;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <path class="checkmark" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <h1>تم الدفع بنجاح 🎉</h1>
    <p>شكرًا ليك! العملية اتمت بنجاح وهنبعتلك تأكيد على الإيميل خلال دقايق.</p>

    <div class="order-box" id="sessionBox" style="display:none;">
      <span>رقم العملية</span>
      <span id="sessionId">—</span>
    </div>

    <a href="/" class="btn">الرجوع للصفحة الرئيسية</a>

    <div class="footer-note">لو محتاج مساعدة تواصل مع الدعم الفني</div>
  </div>

  <script>
    // Stripe يرجع session_id في الرابط لو عايز تعرضه أو تتحقق منه في الباك اند
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    if (sessionId) {
      document.getElementById('sessionBox').style.display = 'flex';
      document.getElementById('sessionId').textContent = sessionId.slice(0, 20) + '...';
    }
  </script>
</body>
</html>
